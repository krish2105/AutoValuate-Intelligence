<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AutoValuate Intelligence">
  <title>AutoValuate Intelligence</title>

  <!--
    The mark is a valuation gauge, not a generic speedometer.

    The amber arc is the scale. The white segment on it is the CONFIDENCE BAND, which is the
    one thing this product does that a price checker does not: it answers with a calibrated
    range rather than a single number. The needle rests inside that band.

    Everything is drawn on a 512 grid around a pivot at (256, 268), sat slightly low so the
    arc reads as optically centred. Strokes stay above 16 units so nothing thins out to a
    hairline at favicon size, and the tick marks are the only element allowed to disappear
    when the icon is rendered small.
  -->

  <defs>
    <linearGradient id="av-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18222F"/>
      <stop offset="1" stop-color="#0B1119"/>
    </linearGradient>

    <radialGradient id="av-glow" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="av-arc" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#E08A12"/>
      <stop offset="0.55" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#FFC759"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect width="512" height="512" rx="114" fill="url(#av-plate)"/>
  <rect width="512" height="512" rx="114" fill="url(#av-glow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5"
        fill="none" stroke="#F5A623" stroke-opacity="0.14" stroke-width="3"/>

  <g transform="translate(0 26)">
  <!-- tick marks: the measurement character. First thing to vanish when scaled down. -->
  <g stroke="#F5A623" stroke-opacity="0.34" stroke-width="7" stroke-linecap="round">
    <line x1="165.8" y1="300.8" x2="154.5" y2="304.9"/>
    <line x1="161.9" y1="249.0" x2="150.1" y2="246.6"/>
    <line x1="185.6" y1="202.7" x2="176.8" y2="194.5"/>
    <line x1="229.9" y1="175.6" x2="226.7" y2="164.1"/>
    <line x1="282.1" y1="175.6" x2="285.3" y2="164.1"/>
    <line x1="326.4" y1="202.7" x2="335.2" y2="194.5"/>
    <line x1="350.1" y1="249.0" x2="361.9" y2="246.6"/>
    <line x1="346.2" y1="300.8" x2="357.5" y2="304.9"/>
  </g>

  <!-- the scale: a 220 degree arc, opening downward -->
  <path d="M 132 313.1 A 132 132 0 1 1 380 313.1"
        fill="none" stroke="url(#av-arc)" stroke-width="36" stroke-linecap="round"/>

  <!-- needle, tapered, with a clear gap to the scale -->
  <path d="M 244.1 260.6 L 311.1 179.8 L 267.9 275.4 Z"
        fill="#F4F8FC" stroke="#F4F8FC" stroke-width="10" stroke-linejoin="round"/>

  <!-- pivot -->
  <circle cx="256" cy="268" r="29" fill="#F5A623"/>
  <circle cx="256" cy="268" r="11" fill="#0B1119"/>
  </g>
</svg>
